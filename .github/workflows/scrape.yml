name: scrape

on:
  workflow_dispatch:          # кнопка «Run workflow» вручную
  # Когда первый запуск пройдёт успешно, раскомментируйте две строки ниже —
  # тогда расписание будет обновляться само каждый час:
  # schedule:
  #   - cron: "17 * * * *"

permissions:
  contents: write

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Save data
        if: always()
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update schedule data" && git push)
