name: scrape

on:
  workflow_dispatch:          # knopka "Run workflow" vruchnuyu
  # kogda pervyy zapusk projdet uspeshno, raskommentiruyte dve stroki nizhe -
  # togda raspisanie budet obnovlyatsya samo (seychas raz v chas, mozhno reze):
  # schedule:
  #   - cron: "17 * * * *"

permissions:
  contents: write

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Save data
        if: always()
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update schedule data"
            # v main mogli poyavitsya novye kommity poka shel skript - podtyagivaem ih, nashi dannye vazhnee
            git pull --rebase -X theirs origin main
            git push
          fi
