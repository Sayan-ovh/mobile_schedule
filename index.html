<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Расписание 564-2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--card:#212121;--cur:#1a3627;--acc:#1fd473;--mut:#9a9a9a;--tx:#fff;--l:#ffb800;--p:#1fd473;--b:#ed3345;--o:#b4b4b4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Onest",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;max-width:600px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;position:relative;padding:10px 16px;min-height:68px}
header h1{font-size:22px;margin:0;font-weight:500}header img{width:42px;height:42px;display:block}
.btns{margin-left:auto;display:flex;align-items:center;gap:6px}
.pill,.circ{background:none;color:var(--mut);border:0;height:44px;font-size:28px;font-weight:500;display:flex;align-items:center;justify-content:center}
.pill{min-width:48px}.circ{width:36px;color:#fff;padding:0}
#menu{position:absolute;right:16px;top:64px;background:#2c2c2c;border-radius:14px;padding:6px;z-index:5;display:none;min-width:200px;box-shadow:0 8px 30px #000a}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;font-size:16px;padding:12px 14px;border-radius:10px}
#menu button.on{color:var(--acc)}
#sub{display:flex;justify-content:space-between;padding:8px 16px;font-size:14px;font-weight:500;color:var(--mut)}
#sub b{color:var(--acc);font-weight:500}#sub button{background:none;border:0;color:var(--acc);font-size:14px;font-weight:500}
main{flex:1;overflow-y:auto;padding:0 14px 40px;-webkit-overflow-scrolling:touch}
.day{display:flex;justify-content:space-between;align-items:baseline;font-size:30px;font-weight:600;margin:22px 0 12px}
.day.past{opacity:.5}.day.today{color:var(--acc)}
.day small{font-weight:500;font-size:12px;background:var(--acc);color:#000;border-radius:10px;padding:3px 8px;margin-left:8px;vertical-align:middle}
.day span:first-child{display:flex;align-items:center}
.none{color:var(--mut);font-size:15px}
.card{position:relative;background:var(--card);border-radius:10px;padding:13px 14px 13px 20px;margin-bottom:10px;overflow:hidden;border:1.5px solid transparent;cursor:pointer}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.card.past{opacity:.5}.card.cur{background:var(--cur);border-color:var(--acc)}
.r1{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);white-space:nowrap}
.r1 .n{border:1.5px solid var(--mut);border-radius:4px;font-size:10px;width:15px;height:15px;display:flex;align-items:center;justify-content:center}
.r1 .t{color:var(--k);font-weight:600;font-size:17px}
.r1 .ok{color:var(--acc)}.r1 .sp{flex:1}
.r1 .pr{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ti{font-size:18px;font-weight:500;line-height:1.25;margin:8px 0 20px}
.r3 span{display:flex;align-items:center;gap:6px}.r3{display:flex;justify-content:space-between;font-size:17px;color:var(--mut);font-weight:500}
.r3 b{color:var(--k);font-weight:500}
.live{color:var(--acc);font-size:14px;font-weight:600;margin-bottom:8px}
.bar{height:4px;background:#ffffff22;border-radius:2px;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
#sw{position:relative;border-bottom:1px solid #2a2a2a}
#sw:after{content:"";position:absolute;left:33.333%;width:33.333%;bottom:-1px;height:2px;background:var(--acc);pointer-events:none}
#strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
#strip::-webkit-scrollbar{display:none}
#strip i{flex:0 0 33.333%}
#strip button{flex:0 0 33.333%;scroll-snap-align:center;background:none;border:0;color:#fff;font:inherit;font-size:16.5px;font-weight:400;padding:14px 0;text-align:center}
#strip button.sel{color:var(--acc);font-weight:500}
#pager.nosnap,#strip.nosnap{scroll-snap-type:none}
#pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pager::-webkit-scrollbar{display:none}
.wk{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:0 14px 40px;position:relative;height:100%}
#ov{position:fixed;inset:0;background:#0000;display:flex;align-items:flex-end;justify-content:center;z-index:9;visibility:hidden;transition:background .35s,visibility 0s .4s}
#ov.open{background:#000a;visibility:visible;transition:background .35s}
#sheet{background:var(--bg);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:12px 24px calc(30px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;transform:translateY(100%);transition:transform .42s cubic-bezier(.22,.9,.28,1)}
#ov.open #sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#444;margin:0 auto 18px}
.tc{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin-bottom:20px}
.tc img{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none}
.tc .nm{font-size:18px;font-weight:600;line-height:1.2}.tc .dg{color:var(--mut);font-size:14px;margin-top:3px}
.tc .rk{font-size:15px;margin-top:4px}.tc .dp{color:var(--mut);font-size:13px;margin-top:3px;line-height:1.3}
#sheet .tag{display:inline-block;font-size:14px;font-weight:600;padding:5px 12px;border-radius:14px;color:var(--k);background:color-mix(in srgb,var(--k) 18%,transparent)}
#sheet h2{font-size:26px;font-weight:600;margin:14px 0 18px}
.row{margin-bottom:16px}.row small{display:block;color:var(--mut);font-size:13px}.row div{font-size:17px;font-weight:500}
</style></head><body>

function weekHtml(w){

function toDay(w,smooth){const p=$("w"+w),t=p.querySelector(".today");p.scrollTo({top:t?t.offsetTop-6:0,behavior:smooth?"smooth":"auto"})}

function setSub(v){sub=v;try{localStorage.setItem("sub",v)}catch(e){}head();renderAll()}
// крутим ленту недель — страницы едут следом
strip.addEventListener("scroll",()=>{
  if(Date.now()<sLock)return;
  const f=strip.scrollLeft/iw(),i=Math.min(TOTAL,Math.max(1,Math.round(f)+1));
  if(i!=wk){wk=i;mark()}
  pLock=Date.now()+120;pager.classList.add("nosnap");
  pager.scrollLeft=f*pager.clientWidth;
  clearTimeout(tP);tP=setTimeout(()=>pager.classList.remove("nosnap"),160);
},{passive:true});
// листаем страницы — лента едет следом
pager.addEventListener("scroll",()=>{
  if(Date.now()<pLock)return;
  const f=pager.scrollLeft/pager.clientWidth,i=Math.min(TOTAL,Math.max(1,Math.round(f)+1));
  if(i!=wk){wk=i;mark()}
  sLock=Date.now()+120;strip.classList.add("nosnap");
  strip.scrollLeft=f*iw();
  clearTimeout(tS);tS=setTimeout(()=>strip.classList.remove("nosnap"),160);
},{passive:true});
addEventListener("resize",()=>show(wk));
function creators(){
  $("menu").style.display="none";
  $("sheet").style.setProperty("--k","var(--acc)");
  $("sheet").innerHTML=`<div class="grab"></div><h2>Создатели</h2><div class="tc" style="padding:20px"><div class="nm">Аюров Саян</div></div>`;
  requestAnimationFrame(()=>$("ov").classList.add("open"));
}
function info(i,ts){
  const x=S[i],date=new Date(ts),td=TD[x.pk];
  let ds=date.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});ds=ds[0].toUpperCase()+ds.slice(1);
  const r=(a,b)=>`<div class="row"><small>${a}</small><div>${b}</div></div>`;
  const ttl=x.k=="o"?"ЭК по ФКС 4 ФКС 7":x.t;
  const tc=td?`<div class="tc"><img src="${PH[x.pk]}" alt=""><div><div class="nm">${td.n}</div>${td.d?`<div class="dg">${td.d}</div>`:""}<div class="rk">${td.r}</div><div class="dp">${td.p}</div></div></div>`:"";
  $("sheet").style.setProperty("--k",K[x.k][1]);
  $("sheet").innerHTML=`<div class="grab"></div>`+(x.k=="o"?"":`<span class="tag">${K[x.k][0]}</span>`)+`<h2>${ttl}</h2>`+tc+r("Дата",ds)+r("Время",`${lab(x.s)} · ${x.s}-я пара`)+(x.b?r("Корпус",x.b):"")+r("Кабинет",x.b?x.r:`Дистанционно (${x.r})`)+(x.e?r("Оснащение",x.e):"")+(x.u?r("Подгруппа","№"+x.u):"");
  $("sheet").scrollTop=0;
  requestAnimationFrame(()=>$("ov").classList.add("open"));
}
const closeInfo=()=>$("ov").classList.remove("open");
$("ov").onclick=e=>{if(e.target.id=="ov")closeInfo()};
addEventListener("keydown",e=>{if(e.key=="Escape")closeInfo()});
$("mb").onclick=e=>{e.stopPropagation();const m=$("menu");m.style.display=m.style.display=="block"?"none":"block"};
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))$("menu").style.display="none"});
setInterval(renderAll,30000);
head();renderAll();show(wk);toDay(wk);
</script></body></html>
